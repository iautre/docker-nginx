name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: nginx
  GHCR_OWNER: iautre
  NGINX_VERSION: 1.31.3
  OPENSSL_VERSION: 3.5.7
  ALPINE_VERSION: 3.24.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Prepare image tags
        id: meta
        shell: bash
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          GHCR_OWNER: ${{ env.GHCR_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          NGINX_VERSION: ${{ env.NGINX_VERSION }}
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tags=${IMAGE_NAME}:${NGINX_VERSION}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:${NGINX_VERSION}"
              echo "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:latest"
              echo "ghcr.io/${GHCR_OWNER,,}/${IMAGE_NAME}:${NGINX_VERSION}"
              echo "ghcr.io/${GHCR_OWNER,,}/${IMAGE_NAME}:latest"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            NGINX_VERSION=${{ env.NGINX_VERSION }}
            OPENSSL_VERSION=${{ env.OPENSSL_VERSION }}
            ALPINE_VERSION=${{ env.ALPINE_VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
