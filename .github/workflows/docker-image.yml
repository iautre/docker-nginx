name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: nginx
  GHCR_OWNER: iautre

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Prepare image tags
        id: meta
        shell: bash
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          GHCR_OWNER: ${{ env.GHCR_OWNER }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          VERSION="$(grep -m1 '^ARG NGINX_VERSION=' Dockerfile | cut -d= -f2)"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "tags=${IMAGE_NAME}:${VERSION}" >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:latest"
              echo "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:${VERSION}"
              echo "ghcr.io/${GHCR_OWNER,,}/${IMAGE_NAME}:latest"
              echo "ghcr.io/${GHCR_OWNER,,}/${IMAGE_NAME}:${VERSION}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: |
            linux/amd64
            linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
