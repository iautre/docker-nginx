main:
  push:
    - services:
        - docker
      stages:
        - name: setup buildx
          script: docker buildx create --use

        - name: build and push
          script: |
            IMAGE="${CNB_DOCKER_REGISTRY}/${CNB_REPO_SLUG_LOWERCASE}"
            docker buildx build --platform linux/amd64,linux/arm64 \
              -t "$IMAGE:latest" \
              -t "$IMAGE:sha-${CNB_COMMIT_SHORT}" \
              --push .
